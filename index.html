<!DOCTYPE html>
<html lang="te">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finance Tracker PWA</title>
    <meta name="theme-color" content="#4f46e5">
    <link rel="manifest" href="data:application/manifest+json,{%22name%22:%22FinanceTracker%22,%22short_name%22:%22Finance%22,%22start_url%22:%22.%22,%22display%22:%22standalone%22,%22background_color%22:%22%23ffffff%22,%22theme_color%22:%22%234f46e5%22}">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; }
    </style>
</head>
<body class="bg-gray-100 min-h-screen pb-10">

    <!-- Header & Dashboard -->
    <div class="bg-indigo-600 text-white p-6 rounded-b-3xl shadow-lg">
        <h1 class="text-xl font-bold mb-4 text-center">ఫైనాన్స్ డ్యాష్‌బోర్డ్ (Finance Tracker)</h1>
        <div class="grid grid-cols-3 gap-2 text-center">
            <div class="bg-indigo-700 p-3 rounded-xl">
                <p class="text-xs text-indigo-200">టోటల్ బ్యాలెన్స్</p>
                <p class="text-lg font-bold mt-1" id="totalBalance">₹0</p>
            </div>
            <div class="bg-green-600 p-3 rounded-xl">
                <p class="text-xs text-green-200">ఇన్కమ్</p>
                <p class="text-lg font-bold mt-1" id="totalIncome">₹0</p>
            </div>
            <div class="bg-red-600 p-3 rounded-xl">
                <p class="text-xs text-red-200">ఎక్స్‌పెన్స్</p>
                <p class="text-lg font-bold mt-1" id="totalExpense">₹0</p>
            </div>
        </div>
    </div>

    <!-- Main Content -->
    <div class="max-w-md mx-auto p-4 space-y-4">

        <!-- Quick UPI Actions -->
        <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-100">
            <h2 class="text-sm font-semibold text-gray-600 mb-3">యూపిఐ (UPI) క్విక్ యాక్షన్స్</h2>
            <div class="grid grid-cols-2 gap-3">
                <a href="upi://pay" class="bg-purple-50 text-purple-700 font-medium p-3 rounded-xl text-center border border-purple-200 hover:bg-purple-100 flex items-center justify-center gap-2">
                    <span>Scan Shop QR</span>
                </a>
                <button onclick="toggleModal('qrModal')" class="bg-blue-50 text-blue-700 font-medium p-3 rounded-xl text-center border border-blue-200 hover:bg-blue-100">
                    Show My QR
                </button>
            </div>
        </div>

        <!-- Add Transaction Form -->
        <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-100">
            <h2 class="text-sm font-semibold text-gray-600 mb-3">కొత్త లావాదేవీ నమోదు చేయండి</h2>
            <form id="txForm" onsubmit="addTransaction(event)" class="space-y-3">
                <div>
                    <input type="number" id="amount" placeholder="అమౌంట్ (₹)" required class="w-full p-3 border rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500">
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <select id="type" class="p-3 border rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-white">
                        <option value="expense">Expense (ఖర్చు)</option>
                        <option value="income">Income (ఆదాయం)</option>
                    </select>
                    <select id="category" class="p-3 border rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-white">
                        <option value="Food">Food</option>
                        <option value="Travel">Travel</option>
                        <option value="Bills">Bills</option>
                        <option value="Salary">Salary</option>
                        <option value="Other">Other</option>
                    </select>
                </div>
                <button type="submit" class="w-full bg-indigo-600 text-white font-semibold p-3 rounded-xl hover:bg-indigo-700">యాడ్ చేయండి</button>
            </form>
        </div>

        <!-- Transaction History -->
        <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-100">
            <h2 class="text-sm font-semibold text-gray-600 mb-3">రీసెంట్ హిస్టరీ</h2>
            <div id="historyList" class="space-y-3">
                <!-- Data renders dynamically -->
            </div>
        </div>
    </div>

    <!-- Show My QR Modal -->
    <div id="qrModal" class="fixed inset-0 bg-black/50 hidden items-center justify-center p-4">
        <div class="bg-white rounded-2xl p-6 text-center max-w-xs w-full space-y-4">
            <h3 class="font-bold text-gray-800">మీ బ్యాంక్ QR కోడ్</h3>
            <div class="bg-gray-200 w-48 h-48 mx-auto rounded-xl flex items-center justify-center border">
                <span class="text-gray-500 text-xs">QR Image Here<br>(సొంత QR Image ని Replace చేసుకోండి)</span>
            </div>
            <button onclick="toggleModal('qrModal')" class="bg-gray-200 text-gray-800 px-4 py-2 rounded-xl text-sm w-full">క్లోజ్</button>
        </div>
    </div>

    <script>
        let transactions = JSON.parse(localStorage.getItem('pwa_tx_data')) || [];

        function updateUI() {
            const historyList = document.getElementById('historyList');
            historyList.innerHTML = '';

            let income = 0;
            let expense = 0;

            if (transactions.length === 0) {
                historyList.innerHTML = '<p class="text-center text-gray-400 text-sm py-4">రికార్డులు ఏవీ లేవు</p>';
            }

            transactions.forEach((tx) => {
                const amt = Number(tx.amount) || 0;
                if (tx.type === 'income') income += amt;
                if (tx.type === 'expense') expense += amt;

                const item = document.createElement('div');
                item.className = 'flex justify-between items-center p-3 bg-gray-50 rounded-xl border border-gray-100';
                
                const isInc = tx.type === 'income';
                item.innerHTML = `
                    <div>
                        <p class="font-semibold text-gray-800 text-sm">${tx.category || 'General'}</p>
                        <p class="text-xs text-gray-400">${tx.dateTime || ''}</p>
                    </div>
                    <span class="font-bold text-sm ${isInc ? 'text-green-600' : 'text-red-600'}">
                        ${isInc ? '+' : '-'}₹${amt.toLocaleString('en-IN')}
                    </span>
                `;
                historyList.appendChild(item);
            });

            document.getElementById('totalIncome').innerText = `₹${income.toLocaleString('en-IN')}`;
            document.getElementById('totalExpense').innerText = `₹${expense.toLocaleString('en-IN')}`;
            document.getElementById('totalBalance').innerText = `₹${(income - expense).toLocaleString('en-IN')}`;
        }

        function addTransaction(e) {
            e.preventDefault();
            const amountVal = document.getElementById('amount').value;
            const typeVal = document.getElementById('type').value;
            const categoryVal = document.getElementById('category').value;

            if (!amountVal || amountVal <= 0) return;

            const now = new Date();
            const formattedDate = `${now.toLocaleDateString('en-IN')} ${now.toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit' })}`;

            const newTx = {
                id: Date.now(),
                amount: parseFloat(amountVal),
                type: typeVal,
                category: categoryVal,
                dateTime: formattedDate
            };

            transactions.unshift(newTx);
            localStorage.setItem('pwa_tx_data', JSON.stringify(transactions));
            
            document.getElementById('amount').value = '';
            updateUI();
        }

        function toggleModal(id) {
            const modal = document.getElementById(id);
            modal.classList.toggle('hidden');
            modal.classList.toggle('flex');
        }

        // Service Worker Registration for PWA functionality
        if ('serviceWorker' in navigator) {
            const swCode = `
                self.addEventListener('fetch', (e) => {
                    e.respondWith(fetch(e.request).catch(() => caches.match(e.request)));
                });
            `;
            const blob = new Blob([swCode], { type: 'application/javascript' });
            navigator.serviceWorker.register(URL.createObjectURL(blob));
        }

        // Initial Load
        updateUI();
    </script>
</body>
</html>
